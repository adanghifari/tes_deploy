name: tes_deploy
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tes_deploy}
      DB_USERNAME: ${DB_USERNAME:-tes_deploy}
      DB_PASSWORD: ${DB_PASSWORD:-tes_deploy_password}
    depends_on:
      - db

  db:
    image: mariadb:10.4.6
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-tes_deploy}
      MYSQL_USER: ${DB_USERNAME:-tes_deploy}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tes_deploy_password}
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  vendor:
  mariadb-data:
